# Kafka producer configuration for TemperatureProducer.
# Fill in the <...> placeholders. On the bastion, `msk-setup <username>` gives you:
#   - bootstrap.servers  -> contents of ~/msk/bootstrap.txt
#   - sasl.jaas.config   -> the same line in ~/msk/<username>.properties
# This file then contains a password: keep it out of version control.

# ---------------------------------------------------------------- Connection
bootstrap.servers=<contents of ~/msk/bootstrap.txt>
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="<username>" password="<password>";

# ------------------------------------------------------------------ Producer
# Exactly-once: idempotent, transactional writes. The transactional.id must be
# stable across restarts and unique per running producer instance.
acks=all
enable.idempotence=true
transactional.id=temperature-producer-1
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=com.amazonaws.services.schemaregistry.serializers.GlueSchemaRegistryKafkaSerializer

# ---------------------------------------------------- Glue Schema Registry
# Uses the default AWS credentials chain (on the bastion: its instance role).
region=ap-southeast-2
registry.name=basic-msk-cluster-registry
# No schemaName: the serializer looks the schema up by the topic name
# (com.example.events.TemperatureChanged). It must already exist in the registry,
# with a version whose definition matches ../avro/temperature-changed.avsc (see README).
dataFormat=AVRO
# Never create schemas or schema versions from the producer.
schemaAutoRegistrationEnabled=false
