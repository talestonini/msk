# Kafka consumer configuration for TemperatureConsumer.
# Fill in the <...> placeholders. On the bastion, `msk-setup <username>` gives you:
#   - bootstrap.servers  -> contents of ~/msk/bootstrap.txt
#   - sasl.jaas.config   -> the same line in ~/msk/<username>.properties
# This file then contains a password: keep it out of version control.

# ---------------------------------------------------------------- Connection
bootstrap.servers=<contents of ~/msk/bootstrap.txt>
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="<username>" password="<password>";

# ------------------------------------------------------------------ Consumer
group.id=temperature-consumers
# Exactly-once: only read events from committed transactions (never aborted ones).
isolation.level=read_committed
# Offsets are committed by the app after each batch is processed.
enable.auto.commit=false
# A new consumer group starts from the beginning of the topic.
auto.offset.reset=earliest
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=com.amazonaws.services.schemaregistry.deserializers.GlueSchemaRegistryKafkaDeserializer

# ---------------------------------------------------- Glue Schema Registry
# Uses the default AWS credentials chain (on the bastion: its instance role).
# The writer's schema version ID is embedded in each message, so no registry
# or schema name is needed here.
region=ap-southeast-2
# Deserialize into the generated com.example.events.TemperatureChanged class.
avroRecordType=SPECIFIC_RECORD
