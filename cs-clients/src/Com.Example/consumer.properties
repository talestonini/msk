# Kafka consumer configuration for TemperatureConsumer (C#).
# Kafka settings use librdkafka names (https://github.com/confluentinc/librdkafka/blob/master/CONFIGURATION.md),
# which differ from the Java client's. Fill in the <...> placeholders. On the bastion,
# `msk-setup <username>` gives you:
#   - bootstrap.servers  -> contents of ~/msk/bootstrap.txt
#   - sasl.username / sasl.password -> MSK_SCRAM_USERNAME / MSK_SCRAM_PASSWORD in ~/msk/<username>.env
# This file then contains a password: keep it out of version control.

# ---------------------------------------------------------------- Connection
bootstrap.servers=<contents of ~/msk/bootstrap.txt>
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.username=<username>
sasl.password=<password>
# CA bundle used to verify the brokers' TLS certificates (Amazon Linux path).
ssl.ca.location=/etc/pki/tls/certs/ca-bundle.crt

# ------------------------------------------------------------------ Consumer
# A separate group from the Java consumer, so each one receives every event.
group.id=temperature-consumers-cs
# Exactly-once: only read events from committed transactions (never aborted ones).
isolation.level=read_committed
# Offsets are committed by the app after each event is processed.
enable.auto.commit=false
# A new consumer group starts from the beginning of the topic.
auto.offset.reset=earliest

# ---------------------------------------------------- Glue Schema Registry
# Read by the Glue deserializer itself, and not passed to librdkafka (see ConfigFile.cs).
# Uses the default AWS credentials chain (on the bastion: its instance role).
# The writer's schema version ID is embedded in each message, so no registry or
# schema name is needed. (The record type, SpecificRecord, is set in code.)
region=ap-southeast-2
dataFormat=AVRO
